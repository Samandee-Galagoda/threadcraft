name: Keep API warm

# Render's free tier sleeps a service after 15 minutes with no traffic, and
# waking it takes ~50 seconds. That is survivable day to day but not during a
# live demo, so this pings /health every 10 minutes.
#
# GitHub throttles scheduled workflows on busy runners, so a firing can be late
# — the 10-minute interval leaves headroom against the 15-minute sleep window.
#
# Set the API_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to your Render URL. Without it the job exits quietly
# rather than failing every 10 minutes and filling your inbox.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you warm it manually right before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "API_URL variable is not set — nothing to ping. Skipping."
            exit 0
          fi
          echo "Pinging ${{ vars.API_URL }}/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "${{ vars.API_URL }}/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK ($code): $(cat /tmp/body)"
              exit 0
            fi
            echo "Attempt $attempt returned $code; retrying…"
            sleep 20
          done
          echo "::warning::API did not respond 200 after 3 attempts (last code $code)"
